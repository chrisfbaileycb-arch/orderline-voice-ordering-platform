services:
  - type: web
    name: orderline
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VITE_CONVEX_URL
        sync: false
      - key: VITE_HERCULES_OIDC_AUTHORITY
        sync: false
      - key: VITE_HERCULES_OIDC_CLIENT_ID
        sync: false
